name: 'Publish Releases'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      is_prerelease: ${{ steps.release_gate.outputs.is_prerelease }}
    steps:
      - name: Validate Tag & Determine Release Mode
        id: release_gate
        shell: bash
        run: |
          if [[ ! "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Desktop release workflow must run on a valid vX.Y.Z tag (got '${{ github.ref }}')."
            exit 1
          fi

          # Strict semantic versioning match: vX.Y.Z -> Stable
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release Mode: STABLE RELEASE (${{ github.ref_name }})"
          else
            # Any tag containing a suffix (-beta, -rc.1) -> Pre-release
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release Mode: PRE-RELEASE (${{ github.ref_name }})"
          fi

      - name: Create Single Draft Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases" \
            -f tag_name="${{ github.ref_name }}" \
            -f name="Ombracrypt ${{ github.ref_name }}" \
            -f body="Automated release build for Windows, macOS, and Linux." \
            -F draft=true \
            -F prerelease=${{ steps.release_gate.outputs.is_prerelease }} \
            --jq '.id')
          echo "Created Draft Release ID: ${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App & Attach to Draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --locked

      - name: Generate & Upload Desktop Checksums (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-checksums
          files=(
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/dmg/*.dmg
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Error: No Desktop installer bundles found for ${{ matrix.platform }}."
            exit 1
          fi
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            cp "$f" "dist-checksums/$base"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist-checksums && sha256sum "$base" > "$base.sha256")
            else
              (cd dist-checksums && shasum -a 256 "$base" > "$base.sha256")
            fi
            test -s "dist-checksums/$base.sha256"
            gh release upload "${{ github.ref_name }}" "dist-checksums/$base.sha256" --clobber
          done

      - name: Generate & Upload Desktop Checksums (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist-checksums | Out-Null
          $patterns = @(
            "target/release/bundle/msi/*.msi",
            "target/release/bundle/nsis/*.exe"
          )
          $bundles = @()
          foreach ($pattern in $patterns) {
            $bundles += Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
          }
          if ($bundles.Count -eq 0) {
            Write-Error "No Windows installer bundles (.msi or .exe) were produced."
            exit 1
          }
          foreach ($bundle in $bundles) {
            $name = $bundle.Name
            $hash = (Get-FileHash -Algorithm SHA256 $bundle.FullName).Hash.ToLower()
            $shaFile = "dist-checksums/$name.sha256"
            "$hash  $name" | Out-File -Encoding ascii -FilePath $shaFile
            if (-not (Test-Path $shaFile) -or (Get-Item $shaFile).Length -eq 0) {
              Write-Error "Failed to generate non-empty checksum file: $shaFile"
              exit 1
            }
            gh release upload "${{ github.ref_name }}" $shaFile --clobber
          }

      - name: Upload Candidate Build Artifacts (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ombracrypt-${{ matrix.platform }}-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error