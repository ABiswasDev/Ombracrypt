name: Ombracrypt Security & CI Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-security-suite:
    name: Workspace Security & Interop Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Validate Frontend Lockfile
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Check JS Syntax
        if: runner.os == 'Linux'
        run: |
          npm ci
          node --check src/main.js

      - name: Install Tauri v2 Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify Workspace Compilation & Warnings
        run: cargo check --workspace --all-targets

      - name: Run Core & CLI Interop Security Suite
        run: cargo test --workspace --release -- --nocapture