[package]
name = "ombracrypt"
version = "2.0.0-beta"
description = "Ombracrypt Post-Quantum Vault"
authors = ["Abhishek Biswas"]
edition = "2021"
license = "CAL-1.0"
repository = "https://github.com/ABiswasDev/Ombracrypt"
readme = "../README.md"

[lib]
name = "ombracrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Core Cryptography & Streaming Engine Dependencies
tar = "0.4.40"
chacha20poly1305 = "0.10.1"
aes-gcm = "0.10.3"
rand = "0.8.5"
argon2 = "0.5.3"
sha2 = "0.10.8"
sha3 = "0.10.8"
hkdf = "0.12.4"
subtle = "2.6.1"
zeroize = "1.8.1"

# NIST FIPS 203 ML-KEM & Classical X25519 Hybrid KEM
fips203 = "0.4.3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

# Cross-Platform Disk Space Telemetry
fs2 = "0.4.3"

# Platform-Specific Direct Bindings for Collision-Proof Atomic Publication
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
