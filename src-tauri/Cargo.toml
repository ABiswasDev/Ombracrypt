[package]
name = "ombracrypt"
version = "2.1.0"
description = "Ombracrypt Post-Quantum Vault"
authors = ["Abhishek Biswas"]
edition = "2021"
license = "CAL-1.0"
repository = "https://github.com/ABiswasDev/Ombracrypt"
readme = "../README.md"

[lib]
name = "ombracrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ombracrypt-core = { path = "../crates/ombracrypt-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8.1"